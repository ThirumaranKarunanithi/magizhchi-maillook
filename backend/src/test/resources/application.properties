# Tests never look mail settings up on the internet (Thunderbird ISPDB, autoconfig, DNS SRV).
maillook.detect.lookups=false

# The automatic save to Magizhchi Box runs only when a test calls it.
maillook.box.auto-save-initial-ms=86400000

# Mailboxes are watched (IMAP IDLE) only in the test about it.
maillook.sync.idle=false
