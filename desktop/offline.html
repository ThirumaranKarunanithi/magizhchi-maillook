<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Magizhchi MailLook</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; height: 100vh; display: grid; place-items: center;
      font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
      background: #fbf8f2; color: #1f2933;
    }
    @media (prefers-color-scheme: dark) { body { background: #0e1a1d; color: #e6f2f1; } p { color: #a9c2c0 !important; } }
    main { max-width: 420px; padding: 24px; text-align: center; }
    img { width: 72px; height: 72px; }
    h1 { font-size: 20px; margin: 14px 0 6px; }
    p { margin: 0 0 18px; color: #52606d; }
    button {
      font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 10px 22px; cursor: pointer;
      background: #f59e0b; color: #1f1300;
    }
  </style>
</head>
<body>
  <main>
    <img src="icon.png" alt="" />
    <h1>Can't reach MailLook right now</h1>
    <p>Check your internet connection. MailLook tries again by itself every 30 seconds.</p>
    <button onclick="location.href = new URLSearchParams(location.search).get('retry') || 'https://maillook.magizhchi.software'">Try again</button>
  </main>
  <script>
    setTimeout(() => document.querySelector('button').click(), 30000)
  </script>
</body>
</html>
