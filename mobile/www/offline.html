<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Magizhchi MailLook</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font: 15px/1.5 system-ui, Roboto, sans-serif;
      background: #fbf8f2; color: #1f2933;
    }
    @media (prefers-color-scheme: dark) { body { background: #0e1a1d; color: #e6f2f1; } p { color: #a9c2c0 !important; } }
    main { max-width: 420px; padding: 24px; text-align: center; }
    h1 { font-size: 20px; margin: 14px 0 6px; }
    p { margin: 0 0 18px; color: #52606d; }
    button {
      font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 10px 22px; cursor: pointer;
      background: #f59e0b; color: #1f1300;
    }
  </style>
</head>
<body>
  <main>
    <!-- Drawn here: this page shows when nothing can load, the app's own files included. -->
    <svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true">
      <rect width="72" height="72" rx="18" fill="#0D6A75" />
      <path d="M18 24h36a3 3 0 0 1 3 3v20a3 3 0 0 1-3 3H18a3 3 0 0 1-3-3V27a3 3 0 0 1 3-3z" fill="#fbf8f2" />
      <path d="M17 27l19 13 19-13" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" />
    </svg>
    <h1>Can't reach MailLook right now</h1>
    <p>Check your internet connection. MailLook tries again by itself every 30 seconds.</p>
    <button onclick="location.href = 'https://maillook.magizhchi.software/'">Try again</button>
  </main>
  <script>
    setTimeout(() => document.querySelector('button').click(), 30000)
  </script>
</body>
</html>
