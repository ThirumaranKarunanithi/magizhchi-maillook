<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Magizhchi MailLook">
  <defs>
    <linearGradient id="ml-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E7C86"/>
      <stop offset="1" stop-color="#0B3A42"/>
    </linearGradient>
    <linearGradient id="ml-sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC94A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect width="128" height="128" rx="30" fill="url(#ml-tile)"/>
  <!-- envelope -->
  <rect x="20" y="40" width="88" height="60" rx="13" fill="#FFFDF8"/>
  <!-- flap drawn as a smile -->
  <path d="M30 50 Q64 84 98 50" fill="none" stroke="#F5B320" stroke-width="8" stroke-linecap="round"/>
  <!-- marigold sun peeking over the corner: "a happy look at your mail" -->
  <circle cx="99" cy="37" r="15" fill="url(#ml-sun)" stroke="#0B3A42" stroke-width="5"/>
</svg>
